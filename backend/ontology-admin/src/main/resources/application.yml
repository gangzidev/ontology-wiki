# 项目相关配置
ontologywiki:
  # 名称
  name: OntologyWiki
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ontologywiki/uploadPath，Linux配置 /home/ontologywiki/uploadPath）
  profile: D:/ontologywiki/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ontologywiki: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    host: ${REDIS_HOST:10.19.38.197}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:11}
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 1
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# 外部系统集成。除非设置对应的 enabled=true 和密钥，否则不会发起外呼。
ontology:
  integration:
    credential-key: ${ONTOLOGY_CREDENTIAL_KEY:change-this-credential-key-in-production}
    # 本地 MySQL 持久化 Wiki；仅通过 OpenAI 兼容 API 调用模型。
    llm-wiki:
      enabled: ${LLM_WIKI_ENABLED:true}
      # 内置 Wiki 不依赖外部 Wiki 客户端；仅调用 OpenAI 兼容模型接口。
      api-base-url: ${LLM_API_BASE_URL:https://fast.sbbbbbbbbb.xyz/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:gpt-6-sol}
      connect-timeout-ms: ${LLM_WIKI_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${LLM_WIKI_READ_TIMEOUT_MS:120000}
    zhiwen:
      enabled: ${ONTOLOGY_ZHIWEN_ENABLED:false}
      base-url: ${ONTOLOGY_ZHIWEN_BASE_URL:}
      type: ${ONTOLOGY_ZHIWEN_TYPE:bot}
      agent-code: ${ONTOLOGY_ZHIWEN_AGENT_CODE:}
      workflow-id: ${ONTOLOGY_ZHIWEN_WORKFLOW_ID:}
      user-id: ${ONTOLOGY_ZHIWEN_USER_ID:ontology-wiki}
      tenant-id: ${ONTOLOGY_ZHIWEN_TENANT_ID:test}
      source: ${ONTOLOGY_ZHIWEN_SOURCE:ONTOLOGY_WIKI}
      secret-id: ${ONTOLOGY_ZHIWEN_SECRET_ID:}
      secret-key: ${ONTOLOGY_ZHIWEN_SECRET_KEY:}
      path: ${ONTOLOGY_ZHIWEN_PATH:/ais/channel/openapi/message/syncAuthChat}
    platform:
      enabled: ${ONTOLOGY_PLATFORM_ENABLED:false}
      base-url: ${ONTOLOGY_PLATFORM_BASE_URL:}
      token: ${ONTOLOGY_PLATFORM_TOKEN:}
      import-path: ${ONTOLOGY_PLATFORM_IMPORT_PATH:}
      # 仅设置指向专用测试环境的地址；接口契约须由目标平台提供。

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${ONTOLOGY_TOKEN_SECRET:change-this-token-secret-in-production}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ontologywiki.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ontologywiki.vip,www.ontologywiki.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/ontology/*
