<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg">
    <title><%= webpackConfig.name %></title>
    <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background: #f6f5f4;
      }

      /* 首屏加载：暖灰底 + 极简标记，与产品内页保持同一套视觉语言 */
      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-align: center;
        -ms-flex-align: center;
        align-items: center;
        -webkit-box-pack: center;
        -ms-flex-pack: center;
        justify-content: center;
        background: #f6f5f4;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .loader-card {
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -ms-flex-direction: column;
        flex-direction: column;
        -webkit-box-align: center;
        -ms-flex-align: center;
        align-items: center;
        text-align: center;
      }

      .loader-mark {
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-align: center;
        -ms-flex-align: center;
        align-items: center;
        -webkit-box-pack: center;
        -ms-flex-pack: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        margin-bottom: 22px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 14px;
        background: #fff;
        box-shadow: rgba(0, 0, 0, 0.04) 0 4px 18px, rgba(0, 0, 0, 0.02) 0 1px 3px;
      }

      .loader-mark::before {
        content: "";
        width: 22px;
        height: 22px;
        border: 2px solid rgba(0, 117, 222, 0.16);
        border-top-color: #0075de;
        border-radius: 50%;
        animation: loader-spin 0.9s linear infinite;
      }

      .loader-title {
        margin: 0;
        color: rgba(0, 0, 0, 0.95);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1.4;
      }

      .loader-sub {
        margin: 8px 0 0;
        color: #a39e98;
        font-size: 12px;
        letter-spacing: 0.02em;
        line-height: 1.5;
      }

      .loader-bar {
        width: 180px;
        height: 2px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.06);
      }

      .loader-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #0075de;
        animation: loader-slide 1.2s ease-in-out infinite;
      }

      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes loader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-mark::before,
        .loader-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loader-wrapper">
        <div class="loader-card">
          <div class="loader-mark"></div>
          <p class="loader-title">正在加载系统资源</p>
          <p class="loader-sub">正在准备工作台，请稍候</p>
          <div class="loader-bar"></div>
        </div>
      </div>
    </div>
  </body>
</html>
